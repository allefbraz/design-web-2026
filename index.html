<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 1 – Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-[400px] mx-auto mt-10 bg-white rounded-2xl shadow-md overflow-hidden">
        <img
            src="premio.jpg"
            alt="Prêmio"
            class="w-full h-48 object-cover"
        >
        <div class="p-6 space-y-3">
            <span class="text-gray-700">
                Jogos Intercampi Estudantis 2026
            </span>
            <h2 class="text-2xl font-bold text-green-800">
                Intercampi inicia fase final estadual em Natal
            </h2>
            <p class="text-gray-700">
                Cerca de 1.200 participantes disputam onze modalides até sábado (29).
                A programação inclui Festival Paralímpico.
            </p>
            <span class="text-gray-700 text-base">
                Há 17 horas
            </span>
        </div>
    </div>
</body>
</html>
